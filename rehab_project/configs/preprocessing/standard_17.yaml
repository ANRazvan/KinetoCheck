name: standard_17

target: src.preprocessing.pipelines.Standard17Preprocessor

joint_mapping:
  source_format: generic_33
  target_format: standard_17

normalization:
  enabled: true
  method: pelvis_center_scale
  center_joint: pelvis
  scale_reference: shoulder_width
  epsilon: 0.000001

temporal:
  max_frames: ${dataset.input.max_frames}
  sampling: uniform
  padding: repeat_last

output:
  num_joints: 17
  num_features: 3
